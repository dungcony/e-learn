# Khóa HS256 dạng base64, tối thiểu 32 byte sau khi giải mã. Bắt buộc cấp qua biến môi trường.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: 3600

app:
  mail:
    from: ${MAIL_FROM:no-reply@elearning.local}
  auth:
    # Gốc URL của frontend, dùng dựng link đặt lại mật khẩu: <frontend-url>/reset-password?token=...
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    reset-token-ttl: 60m
    # Chỉ khi cả hai biến cùng có giá trị và chưa có QTV nào, hệ thống tạo tài khoản QTV đầu tiên lúc khởi động.
    bootstrap-admin-email: ${APP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${APP_ADMIN_PASSWORD:}
  storage:
    base-dir: ${APP_STORAGE_DIR:./uploads}
    public-path: /files
