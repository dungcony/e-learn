spring:
  application:
    name: restaurant
  datasource:
    url: ${DB_URL:postgresql://postgres:Chiyeuminhem@db.tzqlangbhktlunhgopzy.supabase.co:5432/quanlycuahang}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Chiyeuminhem}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      host: ${REDIS_HOST:insect-affable-sugary-75746.db.redis.io}
      port: ${REDIS_PORT:15511}
      username:
      password: aQka0SfBS2YgvGJh7YxBiG2sbbkVQuTx
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Khóa HS256 dạng base64, tối thiểu 32 byte sau khi giải mã. Bắt buộc cấp qua biến môi trường.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: 3600
server:
  port: ${APP_PORT:8000}
app:
  mail:
    from: ${MAIL_FROM:no-reply@restaurant.local}
  auth:
    # Gốc URL của frontend, dùng dựng link đặt lại mật khẩu: <frontend-url>/reset-password?token=...
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    reset-token-ttl: 60m
    # Liên kết xác thực email sau khi khách hàng đăng ký.
    verify-token-ttl: 24h
    # Chỉ khi cả hai biến cùng có giá trị và chưa có Quản lý nào, hệ thống tạo tài khoản Quản lý đầu tiên lúc khởi động.
    bootstrap-admin-email: ${APP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${APP_ADMIN_PASSWORD:}
  storage:
    base-dir: ${APP_STORAGE_DIR:./uploads}
    public-path: /files
  # Quy tắc vận hành nhà hàng (docs/design/README.md mục 2.8); mọi giá trị có mặc định trong RestaurantProperties.
  restaurant:
    open-time: "10:00"
    close-time: "22:00"
    reservation-duration: 120m
    reservation-hold-before: 60m
    no-show-grace: 15m
    booking-min-lead: 2h
    booking-max-ahead-days: 30
    customer-cancel-min-hours: 2
    availability-suggestions: 4
    vat-rate: 0.08
    report-max-days: 366
